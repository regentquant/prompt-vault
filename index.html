  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #f8f6f1;
      --text: #2c2a25;
      --text-secondary: #6e695f;
      --accent: #8b7355;
      --border: #e0dcd4;
      --recessed: #f0ece4;
      --tag-bg: #ebe7df;
      --sidebar-w: 220px;
      --row-hover: #f3f0e9;
    }

    [data-theme="dark"] {
      --bg: #1a1915;
      --text: #e0dcd4;
      --text-secondary: #9a9488;
      --accent: #c4a87a;
      --border: #2e2b25;
      --recessed: #22201b;
      --tag-bg: #2a2722;
      --row-hover: #22201b;
    }

    html {
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      transition: background 0.3s ease, color 0.3s ease;
    }

    /* ---- Sidebar ---- */
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: var(--sidebar-w);
      height: 100vh;
      padding: 48px 28px 32px;
      border-right: 1px solid var(--border);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .sidebar-title {
      font-family: 'Instrument Serif', serif;
      font-size: 1.55rem;
      font-weight: 400;
      letter-spacing: -0.01em;
      line-height: 1.2;
    }

    .sidebar-subtitle {
      font-size: 0.78rem;
      color: var(--text-secondary);
      margin-bottom: 10px;
      line-height: 1.45;
    }

    .sidebar-credit {
      font-size: 0.68rem;
      color: var(--text-secondary);
      opacity: 0.6;
      line-height: 1.45;
      margin-bottom: 28px;
    }

    .sidebar-credit a {
      color: var(--accent);
      text-decoration: none;
    }

    .sidebar-credit a:hover {
      text-decoration: underline;
    }

    /* ---- Quick links ---- */
    .quick-links {
      display: flex;
      gap: 12px;
      margin-bottom: 32px;
    }

    .quick-links a {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      color: var(--text-secondary);
      opacity: 0.55;
      transition: opacity 0.15s ease, color 0.15s ease;
    }

    .quick-links a:hover {
      opacity: 1;
      color: var(--accent);
    }

    .quick-links a img {
      width: 20px;
      height: 20px;
    }

    [data-theme="dark"] .quick-links a img.icon-invert {
      filter: invert(1);
    }

    .sidebar-label {
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-secondary);
      margin-bottom: 16px;
    }

    .sidebar-nav {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .sidebar-nav li {
      position: relative;
    }

    .sidebar-nav button {
      background: none;
      border: none;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.88rem;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 5px 0 5px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      text-align: left;
      transition: color 0.15s ease;
      border-left: 2px solid transparent;
    }

    .sidebar-nav button:hover {
      color: var(--accent);
    }

    .sidebar-nav button.active {
      color: var(--accent);
      font-weight: 500;
      border-left-color: var(--accent);
    }

    .sidebar-nav .cat-count {
      font-size: 0.75rem;
      color: var(--border);
      font-variant-numeric: tabular-nums;
    }

    .sidebar-nav button.active .cat-count {
      color: var(--accent);
      opacity: 0.55;
    }

    .sidebar-total {
      margin-top: auto;
      padding-top: 24px;
      font-size: 0.75rem;
      color: var(--text-secondary);
      opacity: 0.7;
    }

    .theme-toggle {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      color: var(--text-secondary);
      transition: color 0.15s ease;
      display: flex;
      align-items: center;
    }

    .theme-toggle:hover {
      color: var(--accent);
    }

    .theme-toggle svg {
      width: 18px;
      height: 18px;
    }

    /* ---- Main ---- */
    .main {
      margin-left: var(--sidebar-w);
      padding: 48px 56px 80px;
      max-width: 860px;
    }

    /* ---- Search ---- */
    .search-wrap {
      margin-bottom: 48px;
    }

    .search-input {
      width: 100%;
      max-width: 380px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.92rem;
      color: var(--text);
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--border);
      padding: 6px 0;
      outline: none;
      transition: border-color 0.15s ease;
    }

    .search-input::placeholder {
      color: var(--text-secondary);
      opacity: 0.6;
    }

    .search-input:focus {
      border-bottom-color: var(--accent);
    }

    /* ---- Category groups ---- */
    .category-group {
      margin-bottom: 52px;
    }

    .category-header {
      font-family: 'Instrument Serif', serif;
      font-size: 1.35rem;
      font-weight: 400;
      margin-bottom: 20px;
      letter-spacing: -0.01em;
    }

    /* ---- Prompt rows ---- */
    .prompt-row {
      border-top: 1px solid var(--border);
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    .prompt-row:last-child {
      border-bottom: 1px solid var(--border);
    }

    .prompt-row:hover {
      background-color: var(--row-hover);
    }

    .prompt-summary {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 14px;
      gap: 16px;
    }

    .prompt-left {
      min-width: 0;
      flex: 1;
    }

    .prompt-title {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      font-weight: 500;
      margin-bottom: 3px;
      line-height: 1.35;
    }

    .prompt-desc {
      font-size: 0.82rem;
      color: var(--text-secondary);
      line-height: 1.45;
    }

    .prompt-right {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }

    .prompt-tag {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.68rem;
      background: var(--tag-bg);
      color: var(--text-secondary);
      padding: 3px 8px;
      white-space: nowrap;
    }

    .copy-btn {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.78rem;
      color: var(--text-secondary);
      background: none;
      border: 1px solid var(--border);
      padding: 3px 10px;
      cursor: pointer;
      transition: color 0.15s ease, border-color 0.15s ease;
      white-space: nowrap;
    }

    .copy-btn:hover {
      color: var(--accent);
      border-color: var(--accent);
    }

    .copy-btn.copied {
      color: var(--accent);
      border-color: var(--accent);
    }

    .copy-count {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.7rem;
      color: var(--text-secondary);
      opacity: 0.6;
      min-width: 16px;
      text-align: right;
    }

    /* ---- Expanded prompt ---- */
    .prompt-body {
      display: none;
      padding: 0 14px 18px;
    }

    .prompt-body.open {
      display: block;
    }

    .prompt-body-inner {
      background: var(--recessed);
      border-left: 2px solid var(--accent);
      padding: 16px 20px;
      overflow-x: auto;
    }

    .prompt-body-inner pre {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.8rem;
      line-height: 1.6;
      white-space: pre-wrap;
      word-wrap: break-word;
      color: var(--text);
    }

    /* ---- Tags row inside expanded ---- */
    .prompt-tags {
      display: flex;
      gap: 6px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .prompt-tags span {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.65rem;
      color: var(--text-secondary);
      opacity: 0.7;
    }

    /* ---- No results ---- */
    .no-results {
      color: var(--text-secondary);
      font-size: 0.9rem;
      padding: 32px 0;
    }

    /* ---- Mobile ---- */
    @media (max-width: 768px) {
      .sidebar {
        position: static;
        width: 100%;
        height: auto;
        border-right: none;
        border-bottom: 1px solid var(--border);
        padding: 24px 20px 16px;
        flex-direction: column;
        gap: 12px;
      }

      .sidebar-subtitle {
        margin-bottom: 12px;
      }

      .quick-links {
        margin-bottom: 16px;
      }

      .sidebar-label {
        margin-bottom: 8px;
      }

      .sidebar-nav {
        flex-direction: row;
        gap: 0;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        padding-bottom: 4px;
      }

      .sidebar-nav button {
        padding: 6px 14px;
        white-space: nowrap;
        border-left: none;
        border-bottom: 2px solid transparent;
        font-size: 0.84rem;
      }

      .sidebar-nav button.active {
        border-left: none;
        border-bottom-color: var(--accent);
      }

      .sidebar-nav .cat-count {
        display: none;
      }

      .sidebar-total {
        display: none;
      }

      .main {
        margin-left: 0;
        padding: 28px 20px 60px;
      }

      .search-input {
        max-width: 100%;
      }

      .prompt-summary {
        flex-direction: column;
        gap: 8px;
      }

      .prompt-right {
        gap: 10px;
      }
    }
  </style>
</head>

- A "task" is one logical unit of work (e.g., a feature, a bug fix, a refactor) — bundle all related file changes into a single commit
- Use \`git commit -m "subject line"\` with a concise, descriptive subject line only (no body, no multi-line)

      {
        id: "ai-ui-antipatterns",
        title: "AI UI Anti-Patterns Blacklist",
        category: "Coding Agents",
        description: "Comprehensive blacklist of generic AI-generated UI patterns to avoid — purple gradients, card grids, blob decorations, and more.",
        prompt: `# AI UI Anti-Patterns Blacklist

When generating frontend UI code, **never** fall into these patterns. They are the telltale signs of generic, AI-generated design — instantly recognizable and devoid of personality.

---

## CRITICAL — Instant AI Detection

### 1. The Purple Gradient Plague
**Do not** use purple-to-blue or purple-to-pink gradients on white backgrounds. This is the single most recognizable AI aesthetic.
- Avoid: \`linear-gradient(135deg, #667eea, #764ba2)\`
- Avoid: \`linear-gradient(to right, #6366f1, #a855f7, #ec4899)\`
- Avoid: purple hero → white card grid → purple CTA footer

### 2. The Inter/System Font Default
**Do not** default to Inter, Roboto, system-ui, or Arial. These have zero typographic personality.
- Avoid: using the same font family for headlines and body with no pairing
- Avoid: identical weight/size ratios across every project
- Instead: choose a distinctive display font paired with a refined body font

### 3. Raw Tailwind Default Colors
**Do not** ship Tailwind's default palette without customization.
- Avoid: \`bg-indigo-600 text-white rounded-lg shadow-md\`
- Avoid: \`bg-gray-50 border border-gray-200\`
- Avoid: \`text-gray-600\` as universal body text color
- Avoid: mechanical spacing like p-4, p-6, p-8 with no rhythm

### 4. Unstyled shadcn/UI Components
**Do not** use raw shadcn/ui components with zero customization.
- Avoid: default zinc/slate color scheme unchanged
- Avoid: \`border-border\`, \`bg-card\`, \`text-foreground\` without overrides
- Avoid: output that looks like a component library documentation page

---

## HIGH — Very Common, Kills Originality

### 5. The 3-Column Card Grid
**Do not** default to three identical rounded cards in a row, each with icon + title + description.
- Avoid: \`rounded-xl shadow-lg p-6\` on identical cards
- Avoid: equal spacing with zero visual hierarchy
- Avoid: hover effect limited to \`translateY(-4px)\` + shadow increase

### 6. The Centered Hero Formula
**Do not** output the centered headline → subtitle → two buttons pattern every time.
- Avoid: \`text-center max-w-3xl mx-auto\` as automatic hero layout
- Avoid: "Get Started" (filled) + "Learn More" (outlined) button pair
- Avoid: gradient text on the headline with blurred circle decorations behind

### 7. Emoji & Lucide Icon Soup
**Do not** scatter random emojis or generic icons as section markers.
- Avoid: 🚀 Performance ⚡ Speed 🎨 Design 🔒 Security
- Avoid: Sparkles icon on everything
- Avoid: icons chosen for aesthetics rather than communication

### 8. The Fake SaaS Dashboard
**Do not** produce the sidebar + topbar + 4 stat cards + chart layout with fake data.
- Avoid: 4 stat cards in a row with green/red percentages
- Avoid: sidebar with "Dashboard, Analytics, Settings, Profile"
- Avoid: Recharts LineChart with smooth fake data that does nothing

### 9. The Space Grotesk Convergence
**Do not** converge on Space Grotesk, Poppins, Outfit, or Sora when trying to be "creative."
- These are the new Inter — slightly more interesting but equally overused in AI outputs
- Instead: do actual typographic research; pick fonts that match the specific project context

### 10. Mechanical Symmetry & Spacing
**Do not** make everything perfectly centered and symmetrical with uniform padding.
- Avoid: \`mx-auto text-center\` on everything
- Avoid: identical padding on all cards and sections
- Avoid: perfect 1:1:1 column ratios with zero visual tension
- Instead: use asymmetry, negative space, grid-breaking elements, and varied rhythm

---

## MEDIUM — Context-Dependent, Often Layered On

### 11. Gratuitous Glassmorphism
**Do not** apply \`backdrop-blur\` on everything over gradient backgrounds.
- Avoid: \`bg-white/80 backdrop-blur-xl\` as a universal card style
- Avoid: blurred circles behind glass cards with no consideration for readability
- Use frosted glass sparingly and only when it serves the design purpose

### 12. The Dark Mode Cliché
**Do not** default to \`bg-gray-900\` + white text + neon cyan/teal accents.
- Avoid: \`bg-gray-900 text-white\` as the automatic dark theme
- Avoid: cyan/teal glow effects and \`border-cyan-400/50\`
- Avoid: \`from-gray-900 to-black\` gradient backgrounds

### 13. Floating Blob Decorations
**Do not** place random blurred gradient circles behind content for "decoration."
- Avoid: \`absolute -top-40 -right-40 w-80 h-80 bg-purple-300 rounded-full blur-3xl opacity-30\`
- Avoid: multiple overlapping blurred circles with no compositional purpose
- Avoid: same blob placement and color across different projects

### 14. The Universal Hover Effect
**Do not** apply the same hover effect to every interactive element.
- Avoid: \`hover:scale-105 transition-all duration-300\` on everything
- Avoid: \`hover:shadow-xl\` (from shadow-md) as universal hover
- Avoid: \`hover:-translate-y-1\` on all cards
- Instead: vary hover behavior by context — some elements should dim, shift color, reveal content, or do nothing

### 15. The Fake Testimonial Block
**Do not** generate three testimonial cards with circular avatars, fake names, and generic praise.
- Avoid: circular avatar placeholder + "Jane Doe, CEO at TechCorp"
- Avoid: giant quotation marks as decoration
- Avoid: "This product changed my life!" with 5/5 stars, always exactly 3 testimonials

### 16. Gradient Text on Every Headline
**Do not** apply \`bg-clip-text text-transparent bg-gradient-to-r\` to every headline.
- Avoid: \`from-purple-600 to-pink-600\` or \`from-blue-600 to-cyan-600\` on all headings
- If everything is gradient, nothing stands out
- Reserve gradient text for one key element maximum, if used at all

---

## What To Do Instead

1. **Choose a bold, specific aesthetic direction** — brutalist, editorial, retro-futuristic, organic, luxury, industrial, playful — and commit fully
2. **Pick distinctive fonts** — research actual typefaces; pair a characterful display font with a clean body font
3. **Build a custom color palette** — derive colors from the project's context, not from Tailwind defaults
4. **Break the grid** — use asymmetry, overlap, diagonal flow, generous negative space, or controlled density
5. **Add atmosphere** — noise textures, geometric patterns, layered transparencies, dramatic shadows, custom cursors instead of generic blurred circles
6. **Vary interactions** — different hover states for different elements; scroll-triggered reveals; one well-orchestrated animation sequence instead of identical transitions everywhere
7. **Make it specific** — every design should feel like it was made for *this* project, not stamped from a template`,
        tags: ["ui", "design", "antipatterns", "frontend"]
      },

        id: "knowledge-extractor",

        description: "Ruthlessly extracts signal from any content format — books, articles, podcasts, papers — cutting straight to what actually matters.",
        prompt: `# Knowledge Extractor\n\nYou are a ruthless knowledge extractor. Most content has far less signal than its length suggests — your job is to prove it.\n\n**First, identify the content format** (book, article, research paper, podcast transcript, video transcript, lecture, blog post, etc.). Adapt your reading lens accordingly — a research paper front-loads its contribution differently than a book, a podcast meanders differently than an essay — but apply the same extraction rigor regardless.\n\nHere's how to work:\n\n1. **Process the entire content first.** Do not start writing anything until you've processed the full content. You need the full picture before you can judge what actually matters versus what's filler, repetition, or anecdote padding.\n\n2. **Identify the real signal.** Ask yourself:\n   - What are the genuinely novel ideas here — things that would change how someone thinks or acts?\n   - What would the source say if they had 10 minutes instead of the full length?\n   - Which concepts are load-bearing (the argument collapses without them) vs decorative (examples, stories, restated points)?\n   - Is the source saying one big thing, or several independent things?\n\n3. **Design your own structure.** Do NOT default to a sequential section-by-section summary. That just mirrors the original's padding. Instead, organize around the actual ideas. Maybe that's:\n   - One core thesis + the key supporting mechanisms\n   - A set of independent principles\n   - A mental model or framework\n   - A before/after shift in understanding\n   - A decision tree or flowchart of thinking\n   - Something else entirely — whatever best fits THIS content's actual contribution\n\n   Let the content dictate the form. A piece built around one powerful idea needs a different layout than one presenting twelve loosely related tactics.\n\n4. **Be honest about the content's density.** Some pieces have 3 real ideas stretched across far more length than warranted. Say so. Others are genuinely dense with insight. Reflect that. Your summary should be proportional to the actual insight density, not the content length.\n\n5. **Include the sharpest formulations.** If the source said something in a particularly memorable or precise way — a line that captures a whole concept — quote it directly. These are the bits people actually remember and use.\n\n6. **Flag what's actionable.** Separate "interesting to know" from "changes what you do." If the content has practical applications, make them concrete and immediately usable — not vague takeaways like "think more strategically."\n\n7. **Note what the source gets wrong or overstates.** If an idea is presented as universal but clearly has limits, say so. If the evidence is weak for a bold claim, flag it. The reader deserves your honest assessment, not a sales pitch for the content.\n\n**Your output should feel like what a brilliant friend would tell you over coffee after consuming the content — cutting straight to what's worth knowing, skipping everything that isn't, and being honest about the whole thing.**\n\nThe content follows below:\n[PASTE FULL CONTENT — book text, article, transcript, paper, etc.]`,
        tags: ["writing", "summarization", "knowledge", "extraction"]
      },
      {
        id: "write-like-human",
        title: "Write Like a Human",
        category: "Writing & Editing",
        description: "Rewrites any text to sound authentically human — varied sentence structure, natural imperfections, and emotional voice that bypasses AI detection.",
        prompt: `# Write Like a Human\n\nYou are an expert human writer and editor with 20+ years of experience. Your task is to completely rewrite the following text to sound authentically human — natural, unpredictable, and full of personality. Follow these critical instructions:\n\n**PERPLEXITY & PREDICTABILITY CONTROL:**\n- Deliberately choose unexpected, creative word alternatives instead of obvious ones\n- Use varied vocabulary - avoid repetitive word patterns that AI typically generates\n- Include some colloquialisms, idioms, and region-specific expressions\n- Add subtle imperfections that humans naturally make (minor redundancies, natural speech patterns)\n\n**BURSTINESS & SENTENCE VARIATION:**\n- Create dramatic sentence length variation: mix very short sentences (3-5 words) with longer, complex ones (25+ words)\n- Alternate between simple, compound, complex, and compound-complex sentence structures\n- Start sentences with different elements: adverbs, prepositional phrases, dependent clauses, questions\n- Include intentional sentence fragments and run-on sentences where natural\n- Use parenthetical asides and em-dashes for authentic human flow\n\n**EMOTIONAL INTELLIGENCE & HUMAN TOUCH:**\n- Infuse genuine emotional undertones appropriate to the content\n- Add personal opinions, hesitations, or qualifiers ("I believe," "perhaps," "it seems")\n- Include conversational elements and rhetorical questions\n- Use contractions naturally and vary formal/informal tone within the text\n- Add subtle humor, sarcasm, or personality where appropriate\n\n**STRUCTURAL PATTERN DISRUPTION:**\n- Avoid typical introduction → body → conclusion structure\n- Start with unexpected angles or mid-thought observations\n- Include tangential thoughts and natural digressions\n- Use irregular paragraph lengths (some very short, others longer)\n- Break conventional grammar rules occasionally in natural ways\n\n**CONTEXTUAL AUTHENTICITY:**\n- Reference current events, popular culture, or common experiences\n- Include specific, concrete details rather than generic statements\n- Use metaphors and analogies that feel personally chosen\n- Add transitional phrases that feel conversational rather than mechanical\n\n**DETECTION-SPECIFIC COUNTERS:**\n- Use irregular sentence structures and avoid formulaic transitions\n- Counter syntax analysis by including natural human imperfections and conversational quirks\n- Counter emotional tone analysis by adding authentic personal voice and varied emotional expression\n\n**FINAL REQUIREMENTS:**\n- Maintain the original meaning and key information\n- Ensure the rewrite sounds like it came from a real person with authentic voice\n- Make it feel like natural human communication, not polished AI output\n- Include at least 2-3 instances of slightly imperfect but natural phrasing\n- Aim for high perplexity (unpredictable word choices) and high burstiness (varied sentence structures)`,
        tags: ["writing", "rewriting", "humanize", "voice"]
      }
    ];

    // ============================================================
    // APP LOGIC
    // ============================================================

    const categoryNav = document.getElementById('categoryNav');
    const promptContainer = document.getElementById('promptContainer');
    const searchInput = document.getElementById('searchInput');
    const totalCount = document.getElementById('totalCount');

    let activeCategory = 'All';
    let searchQuery = '';

    // Derive categories
    function getCategories() {
      const cats = [];
      const seen = new Set();
      for (const p of PROMPTS) {
        if (!seen.has(p.category)) {
          seen.add(p.category);
          cats.push(p.category);
        }
      }
      return cats;
    }

    // Count prompts per category
    function countByCategory(cat) {
      return PROMPTS.filter(p => p.category === cat).length;
    }

    // Build sidebar
    function renderNav() {
      const categories = getCategories();
      let html = '';

      html += `<li><button class="${activeCategory === 'All' ? 'active' : ''}" data-cat="All">All<span class="cat-count">${PROMPTS.length}</span></button></li>`;
      for (const cat of categories) {
        const isActive = activeCategory === cat;
        html += `<li><button class="${isActive ? 'active' : ''}" data-cat="${cat}">${cat}<span class="cat-count">${countByCategory(cat)}</span></button></li>`;
      }

      categoryNav.innerHTML = html;
      totalCount.textContent = `${PROMPTS.length} prompts`;
    }

    // Filter prompts
    function getFilteredPrompts() {
      let results = PROMPTS;

      if (activeCategory !== 'All') {
        results = results.filter(p => p.category === activeCategory);
      }

      if (searchQuery) {
        const q = searchQuery.toLowerCase();
        results = results.filter(p =>
          p.title.toLowerCase().includes(q) ||
          p.description.toLowerCase().includes(q) ||
          p.prompt.toLowerCase().includes(q) ||
          p.tags.some(t => t.toLowerCase().includes(q))
        );
      }

      return results;
    }

    // Group prompts by category
    function groupByCategory(prompts) {
      const groups = new Map();
      for (const p of prompts) {
        if (!groups.has(p.category)) groups.set(p.category, []);
        groups.get(p.category).push(p);
      }
      return groups;
    }

    // Escape HTML
    function esc(str) {
      const el = document.createElement('span');
      el.textContent = str;
      return el.innerHTML;
    }

    // Render prompts
    function renderPrompts() {
      const filtered = getFilteredPrompts();

      if (filtered.length === 0) {
        promptContainer.innerHTML = '<div class="no-results">No prompts found.</div>';
        return;
      }

      const grouped = groupByCategory(filtered);
      let html = '';

      for (const [category, prompts] of grouped) {
        html += `<div class="category-group">`;
        if (activeCategory === 'All' || searchQuery) {
          html += `<div class="category-header">${esc(category)}</div>`;
        }
        for (const p of prompts) {
          html += `
            <div class="prompt-row" data-id="${p.id}">
              <div class="prompt-summary" onclick="togglePrompt('${p.id}')">
                <div class="prompt-left">
                  <div class="prompt-title">${esc(p.title)}</div>
                  <div class="prompt-desc">${esc(p.description)}</div>
                </div>
                <div class="prompt-right">
                  <span class="prompt-tag">${esc(p.category)}</span>
                  <span class="copy-count" data-count-id="${p.id}"></span>
                  <button class="copy-btn" onclick="copyPrompt(event, '${p.id}')">Copy</button>
                </div>
              </div>
              <div class="prompt-body" id="body-${p.id}">
                <div class="prompt-body-inner">
                  <pre>${esc(p.prompt)}</pre>
                </div>
                ${p.tags.length ? `<div class="prompt-tags">${p.tags.map(t => `<span>#${esc(t)}</span>`).join('')}</div>` : ''}
              </div>
            </div>`;
        }
        html += `</div>`;
      }

      promptContainer.innerHTML = html;
    }

    // Toggle expand/collapse
    function togglePrompt(id) {
      const body = document.getElementById('body-' + id);
      if (body) body.classList.toggle('open');
    }

    // Copy prompt
    function copyPrompt(event, id) {
      event.stopPropagation();
      const prompt = PROMPTS.find(p => p.id === id);
      if (!prompt) return;

      navigator.clipboard.writeText(prompt.prompt).then(() => {
        const btn = event.target;
        btn.textContent = 'Copied \u2713';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = 'Copy';
          btn.classList.remove('copied');
        }, 1500);

        // Increment copy count in Firebase
        if (db) {
          const ref = db.ref('copy-counts/' + id);
          ref.transaction((current) => (current || 0) + 1);
        }
      });
    }

    // Load and display copy counts from Firebase
    function loadCopyCounts() {
      if (!db) return;
      db.ref('copy-counts').on('value', (snapshot) => {
        const counts = snapshot.val() || {};
        for (const [id, count] of Object.entries(counts)) {
          const el = document.querySelector(`[data-count-id="${id}"]`);
          if (el) el.textContent = count;
        }
      });
    }

    // Event: category click
    categoryNav.addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-cat]');
      if (!btn) return;
      activeCategory = btn.dataset.cat;
      renderNav();
      renderPrompts();
    });

    // Event: search
    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderPrompts();
    });

    // Theme toggle
    function getPreferredTheme() {
      const stored = localStorage.getItem('theme');
      if (stored) return stored;
      return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }

    const sunIcon = '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="4.5"/><path stroke-linecap="round" d="M12 2.5v2M12 19.5v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M2.5 12h2M19.5 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>';
    const moonIcon = '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M21.75 15.5a9.72 9.72 0 0 1-13.24-13.24A9.75 9.75 0 1 0 21.75 15.5Z"/></svg>';

    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      document.getElementById('themeToggle').innerHTML = theme === 'dark' ? sunIcon : moonIcon;
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      localStorage.setItem('theme', next);
      applyTheme(next);
    }

    applyTheme(getPreferredTheme());

    // Initial render
    renderNav();
    renderPrompts();
    loadCopyCounts();
  </script>
</body>
</html>
